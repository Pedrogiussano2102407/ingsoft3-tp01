# TP6: cambio chico para probar el rollback
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar constructor con soporte de cache
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2-invento/server
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/backend-coverage:/salida" backend-test:ci

      - name: Resumen del coverage del backend
        if: ${{ !cancelled() }}
        run: |
          F=backend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa collectCoverageFrom'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del backend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: backend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2-invento/server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/pedrogiussano2102407/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar constructor con soporte de cache
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2-invento/client
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen del coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisa el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct}% |\`;
            console.log('### Coverage del frontend');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
          " >> $GITHUB_STEP_SUMMARY

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      - name: Entrar al registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./tp2-invento/client
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/pedrogiussano2102407/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: qa
    env:
      IMAGE_TAG: ${{ github.sha }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Desplegar QA con la imagen de este commit
        shell: powershell
        run: |
          docker compose -f tp2-invento/compose.qa.yml pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose -f tp2-invento/compose.qa.yml up -d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test de QA (con reintentos)
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://localhost:3000/api/categories
              if ($r.StatusCode -eq 200) {
                Write-Host "QA respondio en el intento ${i}"
                exit 0
              }
            } catch { }
            Write-Host "intento ${i}: QA todavia no responde"
            Start-Sleep -Seconds 5
          }
          Write-Host "QA no respondio a tiempo"
          docker compose -f tp2-invento/compose.qa.yml ps
          exit 1

  integracion:
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: qa
    env:
      API_BASE_URL: http://localhost:3001
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    defaults:
      run:
        working-directory: tp2-invento/client/e2e
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Instalar las pruebas
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pruebas de integracion contra la api de QA
        shell: powershell
        run: |
          npx playwright test api.spec.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el reporte de integracion
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integracion
          path: tp2-invento/client/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 30

  e2e:
    needs: integracion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: qa
    env:
      E2E_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    defaults:
      run:
        working-directory: tp2-invento/client/e2e
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Instalar las pruebas
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pruebas e2e con navegador contra QA
        shell: powershell
        run: |
          npx playwright test ui.spec.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Subir el reporte e2e
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: tp2-invento/client/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 30
  deploy-prod:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    env:
      IMAGE_TAG: ${{ github.sha }}
      ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
    steps:
      - name: Bajar el codigo al runner
        uses: actions/checkout@v6

      - name: Desplegar PROD con la imagen verificada
        shell: powershell
        run: |
          docker compose -f tp2-invento/compose.prod.yml pull
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker compose -f tp2-invento/compose.prod.yml up -d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test de PROD (con reintentos)
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://localhost:3010/api/categories
              if ($r.StatusCode -eq 200) {
                Write-Host "PROD respondio en el intento ${i}"
                exit 0
              }
            } catch { }
            Write-Host "intento ${i}: PROD todavia no responde"
            Start-Sleep -Seconds 5
          }
          Write-Host "PROD no respondio a tiempo"
          docker compose -f tp2-invento/compose.prod.yml ps
          exit 1