services:
  backend:
    image: ghcr.io/pedrogiussano2102407/invento-backend:latest
    container_name: invento-backend
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/categories"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/pedrogiussano2102407/invento-frontend:latest
    container_name: invento-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped